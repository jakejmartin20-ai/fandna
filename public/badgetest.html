<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FanDNA Badge Check</title>
  <style>
    body { background:#16161e; color:#e8e4de; font-family:monospace; padding:20px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
    .card { border:1px solid #2e2e45; border-radius:8px; padding:12px; text-align:center; }
    .card.ok { border-color:#22c55e; }
    .card.fail { border-color:#ef4444; }
    .card.emoji-only { border-color:#888; }
    .badge { width:56px; height:56px; object-fit:contain; display:block; margin:0 auto 6px; }
    .emoji { font-size:42px; line-height:56px; display:block; margin:0 auto 6px; text-align:center; }
    .label { font-size:10px; color:#888; }
    #summary { margin-bottom:16px; font-size:13px; }
  </style>
</head>
<body>
  <h2 style="font-size:15px;margin-bottom:8px">FanDNA — Badge Status</h2>
  <p id="summary">Testing...</p>
  <div class="grid" id="grid"></div>
  <script>
    const clubs = [
      ["LI","Liverpool","🔴","https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg"],
      ["MC","Man City","🔵","https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg"],
      ["AR","Arsenal","🔴","https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg"],
      ["EV","Everton","🔵","https://upload.wikimedia.org/wikipedia/en/7/7c/Everton_FC_logo.svg"],
      ["NC","Newcastle","⚫","https://upload.wikimedia.org/wikipedia/en/5/56/Newcastle_United_Logo.svg"],
      ["WH","West Ham","⚒️","https://upload.wikimedia.org/wikipedia/en/c/c2/West_Ham_United_FC_logo.svg"],
      ["CP","Crystal Palace","🦅",""],
      ["MU","Man Utd","🔴","https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg"],
      ["SP","Spurs","⚪","https://upload.wikimedia.org/wikipedia/en/b/b4/Tottenham_Hotspur.svg"],
      ["LE","Leicester","🦊","https://upload.wikimedia.org/wikipedia/en/2/2d/Leicester_City_crest.svg"],
      ["NF","Nottm Forest","🌲","https://upload.wikimedia.org/wikipedia/en/e/e5/Nottingham_Forest_F.C._logo.svg"],
      ["BR","Brentford","🐝","https://upload.wikimedia.org/wikipedia/en/2/2a/Brentford_FC_crest.svg"],
      ["BH","Brighton","🐦","https://upload.wikimedia.org/wikipedia/en/f/fd/Brighton_%26_Hove_Albion_logo.svg"],
      ["WO","Wolves","🐺","https://upload.wikimedia.org/wikipedia/en/f/fc/Wolverhampton_Wanderers.svg"],
      ["FU","Fulham","⚫","https://upload.wikimedia.org/wikipedia/en/e/eb/Fulham_FC_%28shield%29.svg"],
      ["BO","Bournemouth","🍒","https://upload.wikimedia.org/wikipedia/en/e/e5/AFC_Bournemouth_%282013%29.svg"],
      ["AV","Aston Villa","🦁",""],
      ["SU","Sunderland","🐱",""],
      ["LU","Leeds","⚪","https://upload.wikimedia.org/wikipedia/en/5/54/Leeds_United_F.C._logo.svg"],
      ["CH","Chelsea","🔵","https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg"],
      ["IT","Ipswich","🔵","https://upload.wikimedia.org/wikipedia/en/4/43/Ipswich_Town.svg"],
      ["CV","Coventry","🩵",""],
    ];
    const grid = document.getElementById('grid');
    let loaded=0, failed=0, emojiOnly=0;
    clubs.forEach(([code,name,emoji,url]) => {
      const card = document.createElement('div');
      if(!url) {
        card.className='card emoji-only';
        card.innerHTML='<span class="emoji">'+emoji+'</span><div class="label">'+code+' — '+name+'<br><span style="color:#666">emoji only</span></div>';
        emojiOnly++;
        update();
      } else {
        card.className='card';
        card.innerHTML='<img class="badge" src="'+url+'"><div class="label">'+code+' — '+name+'</div>';
        grid.appendChild(card);
        const img=card.querySelector('img');
        img.onload=()=>{card.classList.add('ok');loaded++;update();};
        img.onerror=()=>{
          card.classList.remove('ok');
          card.classList.add('fail');
          card.innerHTML='<span class="emoji">'+emoji+'</span><div class="label">'+code+' — '+name+'<br><span style="color:#ef4444">badge failed</span></div>';
          failed++;update();
        };
      }
      if(url) grid.appendChild(card);
    });
    function update(){
      const done=loaded+failed+emojiOnly;
      document.getElementById('summary').textContent=
        done+'/22 — '+loaded+' badges loaded ✓  '+failed+' failed ✗  '+emojiOnly+' emoji only';
    }
  </script>
</body>
</html>
